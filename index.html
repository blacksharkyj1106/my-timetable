<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的课表">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>我的课表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
 <header class="bar">
  <div class="heading">
   <label class="week-title">
    <h1>第 <span id="weekNumber">8</span> 周<svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></h1>
    <select id="weekPicker" aria-label="选择周次"></select>
   </label>
   <p class="sub"><span id="dateRange"></span><button id="today" class="today-link" hidden>回到本周</button></p>
  </div>
  <div class="actions">
   <div class="seg">
    <button id="prev" aria-label="上一周"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
    <button id="next" aria-label="下一周"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
   </div>
   <button id="help" class="round" aria-label="使用说明"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v4.5"/><circle class="dot" cx="10" cy="6.4" r=".6"/></svg></button>
   <button id="add" class="round primary" aria-label="添加课程"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg></button>
  </div>
 </header>
 <div class="dates" id="dates"></div>
 <div class="board" id="board">
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>本周没有课程</p>
 </div>
</main>

<dialog id="editor">
 <form id="form">
  <div class="sheet-head">
   <button type="button" id="close" class="text-btn">取消</button>
   <h2 id="sheetTitle">课程详情</h2>
   <button class="text-btn strong save" type="submit">保存</button>
  </div>
  <div class="group">
   <label>课程名称<input id="title" required maxlength="80"></label>
   <label>上课地点<input id="location" placeholder="输入完整教室" maxlength="150"></label>
  </div>
  <p id="sourceNote" class="hint"></p>
  <div class="group pair">
   <label>周次<select id="week"></select></label>
   <label>星期<select id="day"><option value="0">星期一</option><option value="1">星期二</option><option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option><option value="5">星期六</option><option value="6">星期日</option></select></label>
  </div>
  <div class="group pair">
   <label>开始时间<input type="time" id="start" required></label>
   <label>结束时间<input type="time" id="end" required></label>
  </div>
  <div class="group">
   <label>备注<textarea id="memo" rows="2" maxlength="300"></textarea></label>
  </div>
  <p id="error" role="alert"></p>
  <button id="remove" type="button" class="delete">删除本次课程</button>
 </form>
</dialog>

<dialog id="info">
 <div class="sheet-head">
  <span></span>
  <h2>使用说明</h2>
  <button id="closeInfo" class="text-btn strong">完成</button>
 </div>
 <div class="group prose">
  <p><b>2026–2027 第 1 学期 · 第 1–18 周</b>，第 1 周从 8 月 31 日开始，按完整教务课表的开课周次显示，普通课堂与附属课堂按周自动切换。晚课 18:30–20:05。</p>
  <p>点课程可查看完整地点，并修改名称、时间和地点；点标题可直接跳到任意一周，在课表上左右滑动也能切换周次。学校临时调课需手动修改。</p>
  <p>iPhone 上用 Safari 打开此页面，点分享按钮，再选择「添加到主屏幕」。</p>
  <p>修改只保存在当前设备的浏览器里，清理网站数据会丢失，也不会同步到其他设备，换设备前请先导出备份。</p>
 </div>
 <div class="group">
  <button id="backup" class="row-btn">导出课表备份</button>
  <label class="row-btn import">恢复备份<input id="restore" type="file" accept="application/json,.json"></label>
 </div>
 <p id="backupStatus" class="hint" role="status"></p>
</dialog>
<div id="toast" role="status"></div>
<script src="semester.js"></script>
<script src="app.js"></script>
</body>
</html>
